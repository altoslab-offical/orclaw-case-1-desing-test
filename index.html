<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>大闸蟹 — 設計提案</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; color:#fff; font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
    .label { font-size:10px; letter-spacing:0.35em; text-transform:uppercase; color:#555; margin-bottom:20px; }
    h1 { font-size:clamp(1.8rem,5vw,3rem); font-weight:700; letter-spacing:-0.03em; margin-bottom:8px; }
    .sub { font-size:14px; color:#666; margin-bottom:60px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; width:100%; max-width:820px; }
    .card { border:1px solid #222; background:#111; padding:32px 28px; text-decoration:none; color:#fff; transition:all 0.3s; position:relative; overflow:hidden; }
    .card:hover { border-color:#444; background:#181818; transform:translateY(-2px); }
    .card-tag { font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:#555; margin-bottom:16px; display:block; }
    .card-num { font-size:3.5rem; font-weight:800; line-height:1; margin-bottom:12px; }
    .v1 .card-num { color:#e85542; }
    .v2 .card-num { color:#5c6bc0; }
    .v3 .card-num { color:#00f4fe; }
    .card-title { font-size:13px; font-weight:600; margin-bottom:6px; letter-spacing:0.02em; }
    .card-desc { font-size:11px; color:#666; line-height:1.6; }
    .card-arrow { position:absolute; bottom:28px; right:28px; font-size:18px; opacity:0.2; transition:opacity 0.3s; }
    .card:hover .card-arrow { opacity:0.8; }
    .footer { margin-top:48px; font-size:11px; color:#333; letter-spacing:0.1em; }
  </style>
</head>
<body>
  <div class="label">設計提案 · Design Preview</div>
  <h1>大闸蟹 Landing Page</h1>
  <p class="sub">三個設計方向，請選擇查看</p>

  <div class="cards">
    <a href="/templates/v1.html" class="card v1">
      <span class="card-tag">Version 01</span>
      <div class="card-num">V1</div>
      <div class="card-title">原版 · Dark Tech</div>
      <p class="card-desc">黑底紅橙配色，Bebas Neue 衝擊感大標，終端機風格</p>
      <span class="card-arrow">↗</span>
    </a>
    <a href="/templates/v2.html" class="card v2">
      <span class="card-tag">Version 02</span>
      <div class="card-num">V2</div>
      <div class="card-title">Innovation Editorial</div>
      <p class="card-desc">白底紫色，Inter 字型，編輯風格，Vanta Dots 背景</p>
      <span class="card-arrow">↗</span>
    </a>
    <a href="/templates/v3.html" class="card v3">
      <span class="card-tag">Version 03</span>
      <div class="card-num">V3</div>
      <div class="card-title">Digital Frontier</div>
      <p class="card-desc">黑底電子青 + 螢光綠，Vanta Waves，終端美學</p>
      <span class="card-arrow">↗</span>
    </a>
  </div>

  <p class="footer">© 2026 大闸蟹 CLOUD</p>
</body>
</html>
